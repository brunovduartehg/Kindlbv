<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Todo</title>
  <style>
    body{margin:0;background:#f8f8f0;color:#000;font-family:Georgia,'Times New Roman',serif;font-size:20px;}
    .app{max-width:900px;margin:auto;padding:14px;}
    h1{font-size:34px;margin:6px 0 2px;text-align:center;}
    .sub{text-align:center;font-size:15px;margin-bottom:12px;color:#444;border-bottom:3px solid #000;padding-bottom:10px;}
    button,input,textarea,select{font-family:Georgia,'Times New Roman',serif;font-size:20px;border:2px solid #000;background:#fff;color:#000;border-radius:4px;padding:12px;box-sizing:border-box;}
    button{font-weight:bold;cursor:pointer;}
    input,select,textarea{width:100%;}
    textarea{min-height:180px;line-height:1.4;}
    .box{border:3px solid #000;background:#fff;padding:12px;margin-bottom:14px;border-radius:4px;}
    .row{margin-bottom:10px;}
    .actions button{width:32%;margin-right:1%;padding:10px 4px;font-size:17px;}
    .task{border:2px solid #000;background:#fff;margin:10px 0;padding:10px;display:table;width:100%;box-sizing:border-box;}
    .task.active{outline:4px solid #000;}
    .task.done .task-title{text-decoration:line-through;color:#555;}
    .ck{display:table-cell;width:42px;vertical-align:top;}
    .check{width:34px;height:34px;border:3px solid #000;text-align:center;line-height:30px;font-weight:bold;font-size:24px;}
    .task-body{display:table-cell;vertical-align:top;padding-left:8px;}
    .task-title{font-size:22px;font-weight:bold;line-height:1.2;}
    .meta{font-size:15px;color:#333;margin-top:5px;}
    .badge{border:1px solid #000;padding:2px 6px;margin-right:4px;background:#eee;}
    .detail-title{font-size:28px;font-weight:bold;border:0;border-bottom:3px solid #000;border-radius:0;padding-left:0;margin-bottom:10px;}
    .sec{font-size:22px;font-weight:bold;border-bottom:2px solid #000;margin:18px 0 8px;padding-bottom:4px;}
    .mini{display:table;width:100%;margin:8px 0;}
    .mini-c,.mini-x{display:table-cell;width:40px;vertical-align:middle;}
    .mini-input{display:table-cell;vertical-align:middle;padding:0 6px;}
    .mini-x button{padding:8px 10px;}
    .empty{text-align:center;padding:50px 10px;color:#444;}
    .danger{background:#eee;}
    .pc-layout{display:block;}
    @media (min-width:901px){
      body:not(.force-kindle){font-family:Arial,sans-serif;font-size:18px;background:#f3f3f3;}
      body:not(.force-kindle) .pc-layout{display:grid;grid-template-columns:380px 1fr;gap:16px;}
      body:not(.force-kindle) h1{text-align:left;}
      body:not(.force-kindle) .sub{text-align:left;}
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Kindle Todo</h1>
    <div class="sub">Organize no PC. Execute no Kindle.</div>

    <div class="actions row">
      <button onclick="togglePcMode()">Tela PC</button>
      <button onclick="exportData()">Exportar</button>
      <button onclick="importData()">Importar</button>
    </div>

    <div class="pc-layout">
      <div class="box">
        <div class="row"><input id="newTitle" placeholder="Nova tarefa..." onkeydown="enterAdd(event)"></div>
        <div class="row"><select id="newProject"><option>Geral</option><option>Loja</option><option>Financeiro</option><option>Marketing</option><option>Pessoal</option></select></div>
        <div class="row"><select id="newPriority"><option>Normal</option><option>Alta</option><option>Baixa</option></select></div>
        <div class="row"><button style="width:100%" onclick="addTask()">+ Adicionar</button></div>
        <div class="row"><input id="search" placeholder="Buscar..." oninput="render()"></div>
        <div class="row"><select id="filter" onchange="render()"><option value="all">Todas</option><option value="open">Abertas</option><option value="done">Concluídas</option></select></div>
        <div id="taskList"></div>
      </div>

      <div class="box" id="detail"></div>
    </div>
  </div>

<script>
var STORAGE_KEY='kindle_todo_v3';
var tasks=loadTasks();
var selectedId=tasks.length?tasks[0].id:null;

function uid(){return String(new Date().getTime())+String(Math.floor(Math.random()*99999));}
function loadTasks(){try{var s=localStorage.getItem(STORAGE_KEY);if(s){return JSON.parse(s);}}catch(e){}return [{id:uid(),title:'Exemplo: organizar tarefas da loja',project:'Loja',priority:'Alta',done:false,notes:'Aqui fica a área interna da tarefa. No PC você escreve mais rápido. No Kindle você consulta e marca.',checklist:[{id:uid(),text:'Criar no PC',done:true},{id:uid(),text:'Abrir no Kindle',done:false},{id:uid(),text:'Marcar checkbox',done:false}]}];}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));}catch(e){}}
function enterAdd(e){if(e.key==='Enter')addTask();}
function addTask(){var el=document.getElementById('newTitle');var title=el.value.replace(/^\s+|\s+$/g,'');if(!title)return;var t={id:uid(),title:title,project:document.getElementById('newProject').value,priority:document.getElementById('newPriority').value,done:false,notes:'',checklist:[]};tasks.unshift(t);selectedId=t.id;el.value='';save();render();}
function selectTask(id){selectedId=id;render();setTimeout(function(){document.getElementById('detail').scrollIntoView();},50);}
function toggleDone(id){for(var i=0;i<tasks.length;i++){if(tasks[i].id===id){tasks[i].done=!tasks[i].done;break;}}save();render();}
function updateTask(id,field,value){for(var i=0;i<tasks.length;i++){if(tasks[i].id===id){tasks[i][field]=value;break;}}save();renderList();}
function deleteTask(id){if(!confirm('Apagar esta tarefa?'))return;var n=[];for(var i=0;i<tasks.length;i++){if(tasks[i].id!==id)n.push(tasks[i]);}tasks=n;selectedId=tasks.length?tasks[0].id:null;save();render();}
function addChecklist(id){var t=getTask(id);if(!t)return;t.checklist.push({id:uid(),text:'',done:false});save();render();}
function toggleChecklist(tid,iid){var t=getTask(tid);if(!t)return;for(var i=0;i<t.checklist.length;i++){if(t.checklist[i].id===iid)t.checklist[i].done=!t.checklist[i].done;}save();render();}
function updateChecklist(tid,iid,value){var t=getTask(tid);if(!t)return;for(var i=0;i<t.checklist.length;i++){if(t.checklist[i].id===iid)t.checklist[i].text=value;}save();}
function removeChecklist(tid,iid){var t=getTask(tid);if(!t)return;var n=[];for(var i=0;i<t.checklist.length;i++){if(t.checklist[i].id!==iid)n.push(t.checklist[i]);}t.checklist=n;save();render();}
function getTask(id){for(var i=0;i<tasks.length;i++){if(tasks[i].id===id)return tasks[i];}return null;}
function filtered(){var q=(document.getElementById('search')?document.getElementById('search').value:'').toLowerCase();var f=(document.getElementById('filter')?document.getElementById('filter').value:'all');var out=[];for(var i=0;i<tasks.length;i++){var t=tasks[i];var txt=(t.title+' '+t.project+' '+t.priority+' '+t.notes).toLowerCase();var okText=txt.indexOf(q)>-1;var okFilter=f==='all'||(f==='open'&&!t.done)||(f==='done'&&t.done);if(okText&&okFilter)out.push(t);}return out;}
function renderList(){var list=document.getElementById('taskList');var arr=filtered();var html='';for(var i=0;i<arr.length;i++){var t=arr[i];var done=0;for(var j=0;j<t.checklist.length;j++)if(t.checklist[j].done)done++;html+='<div class="task '+(t.done?'done ':'')+(t.id===selectedId?'active':'')+'"><div class="ck"><div class="check" onclick="toggleDone(\''+t.id+'\')">'+(t.done?'✓':'')+'</div></div><div class="task-body"><div class="task-title" onclick="selectTask(\''+t.id+'\')">'+esc(t.title)+'</div><div class="meta"><span class="badge">'+esc(t.project)+'</span><span class="badge">'+esc(t.priority)+'</span>'+done+'/'+t.checklist.length+'</div></div></div>';}
list.innerHTML=html||'<div class="empty">Nenhuma tarefa.</div>';}
function renderDetail(){var d=document.getElementById('detail');var t=getTask(selectedId);if(!t){d.innerHTML='<div class="empty">Selecione uma tarefa.</div>';return;}var html='<button onclick="toggleDone(\''+t.id+'\')" style="width:49%">'+(t.done?'✓ Feita':'Marcar feita')+'</button> <button class="danger" onclick="deleteTask(\''+t.id+'\')" style="width:49%">Apagar</button>';
html+='<div class="sec">Tarefa</div><input class="detail-title" value="'+attr(t.title)+'" oninput="updateTask(\''+t.id+'\',\'title\',this.value)">';
html+='<div class="row"><select onchange="updateTask(\''+t.id+'\',\'project\',this.value)">'+opt('Geral',t.project)+opt('Loja',t.project)+opt('Financeiro',t.project)+opt('Marketing',t.project)+opt('Pessoal',t.project)+'</select></div>';
html+='<div class="row"><select onchange="updateTask(\''+t.id+'\',\'priority\',this.value)">'+opt('Normal',t.priority)+opt('Alta',t.priority)+opt('Baixa',t.priority)+'</select></div>';
html+='<div class="sec">Anotações internas</div><textarea oninput="updateTask(\''+t.id+'\',\'notes\',this.value)" placeholder="Escreva os detalhes aqui...">'+esc(t.notes||'')+'</textarea>';
html+='<div class="sec">Checklist interno</div>';for(var i=0;i<t.checklist.length;i++){var it=t.checklist[i];html+='<div class="mini"><div class="mini-c"><div class="check" onclick="toggleChecklist(\''+t.id+'\',\''+it.id+'\')">'+(it.done?'✓':'')+'</div></div><div class="mini-input"><input value="'+attr(it.text)+'" oninput="updateChecklist(\''+t.id+'\',\''+it.id+'\',this.value)"></div><div class="mini-x"><button onclick="removeChecklist(\''+t.id+'\',\''+it.id+'\')">×</button></div></div>';}
html+='<button onclick="addChecklist(\''+t.id+'\')" style="width:100%;margin-top:8px">+ Item</button>';d.innerHTML=html;}
function render(){renderList();renderDetail();}
function opt(v,c){return '<option '+(v===c?'selected':'')+'>'+v+'</option>';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function attr(s){return esc(s).replace(/`/g,'&#096;');}
function togglePcMode(){document.body.className=document.body.className==='force-kindle'?'':'force-kindle';}
function exportData(){var data=JSON.stringify(tasks,null,2);var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(data);a.download='kindle-todo-backup.json';a.click();}
function importData(){var txt=prompt('Cole aqui o backup JSON:');if(!txt)return;try{var data=JSON.parse(txt);if(!data.length)throw 'erro';tasks=data;selectedId=tasks[0].id;save();render();}catch(e){alert('Backup inválido.');}}
render();
</script>
</body>
</html>
